# Karpenter - Helm values
# helm-install-from-tfoutput.sh가 이 파일을 -f로 넘기고, 아래 <> 동적 값만 --set으로 덮어쓴다.
#   settings.clusterName        : terraform output → cluster_name
#   settings.interruptionQueue  : terraform output karpenter → queue_name
#   serviceAccount.name         : terraform output karpenter → service_account ("karpenter")

settings:
  clusterName: <cluster_name>
  interruptionQueue: <queue_name>   # SQS 인터럽션 큐 (인프라 karpenter 서브모듈이 생성)

# Pod Identity association(인프라에서 생성)이 권한을 연결하므로 SA는 생성만.
# 이름은 association의 service_account와 반드시 일치. (annotation 불필요 = Pod Identity)
serviceAccount:
  create: true
  name: karpenter

# 컨트롤러 자원 요청/제한. Karpenter 공식 권장값(requests=limits, cpu 1 / memory 1Gi).
# 차트 default는 {}(무제한)이나, 프로덕션은 컨트롤러 안정성 위해 고정 권장.
controller:
  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits:
      cpu: 1
      memory: 1Gi
