# AWS Load Balancer Controller - Helm values
# helm-install-from-tfoutput.sh가 이 파일을 -f로 넘기고, 아래 <> 동적 값만 --set으로 덮어쓴다.
#   clusterName : terraform output → cluster_name
#   region      : terraform output → aws_region
#   vpcId       : terraform output → vpc_id

clusterName: <cluster_name>
region: <aws_region>
vpcId: <vpc_id>

# Pod Identity association이 SA에 권한을 연결하므로 SA는 생성만 하면 됨.
# 이름은 iam.tf association 값과 반드시 일치. (annotation은 IRSA 방식일 때만 필요 → 여기선 불필요)
serviceAccount:
  create: true
  name: aws-load-balancer-controller
